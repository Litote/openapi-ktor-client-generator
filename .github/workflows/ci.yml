name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1

  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/setup-gradle@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/detect-changes@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        id: detect-changes

      - name: Warm up convention build
        run: ./gradlew :convention:assemble --no-configuration-cache

      - name: Build & test
        run: ./gradlew check

      - uses: Litote/ci/.github/actions/sonar-gradle@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

      - name: Publish SNAPSHOT to Maven Central
        if: github.event_name == 'push' && steps.detect-changes.outputs.has-code-changes == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

  e2e-split:
    name: E2E Split-by-client
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/setup-gradle@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/detect-changes@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        id: detect-changes

      - name: Publish plugin to Maven Local
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        run: ./gradlew publishToMavenLocal

      - name: Generate split-by-client subproject
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        working-directory: e2e-split
        run: >
          ./gradlew initApiClientSubproject
          -PopenApiFile=src/main/openapi/sample.json
          -PsplitByClient=true
          -PbasePackage=org.litote.sample
          -PsplitGranularity=BY_TAG_AND_OPERATION
          -PsharedModelGranularity=SHARED_PER_GROUP
          -PsubprojectRootDirectory=client

      - name: Verify generated structure
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        working-directory: e2e-split
        run: |
          EXPECTED_DIRS=(
            "client/shared"
            "client/shared-userusersget-useruserspost"
            "client/shared-orderordersget-orderorderspost"
            "client/user-users-get-client"
            "client/user-users-post-client"
            "client/order-orders-get-client"
            "client/order-orders-post-client"
          )
          for dir in "${EXPECTED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Missing expected directory: $dir"
              exit 1
            fi
            echo "OK: $dir"
          done
          if ! grep -q 'openapi-ktor-generated-includes' settings.gradle.kts; then
            echo "settings.gradle.kts is missing the generated includes marker"
            exit 1
          fi
          if ! grep -q 'include(' settings.gradle.kts; then
            echo "settings.gradle.kts is missing include() statements"
            exit 1
          fi
          echo "settings.gradle.kts includes:"
          grep 'include(' settings.gradle.kts

      - name: Build generated subproject
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        working-directory: e2e-split
        run: ./gradlew build


  e2e:
    name: E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/setup-gradle@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/detect-changes@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        id: detect-changes

      - name: Publish plugin to Maven Local
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        run: ./gradlew publishToMavenLocal

      - name: Build e2e project
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        working-directory: e2e
        run: ./gradlew build

      - name: Verify generated code is up-to-date
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        run: |
          git diff --exit-code -- e2e/ || {
            echo "Generated code in e2e/ is out of date. Run ./gradlew build in e2e/ and commit the result."
            git diff -- e2e/
            exit 1
          }

