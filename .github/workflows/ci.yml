name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semantic-pr-title:
    if: github.event_name == 'pull_request'
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph: disabled
          build-scan-publish: false

      - name: Detect code changes
        id: detect-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
          fi
          if echo "$CHANGED" | grep -qE '\.(kt|kts|gradle|yml|yaml|toml)$'; then
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Warm up convention build
        run: ./gradlew :convention:assemble --no-configuration-cache

      - name: Build & test
        run: ./gradlew check

      - name: Jacoco aggregated report
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        run: ./gradlew jacocoAggregatedReport

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        if: env.SONAR_TOKEN != '' && steps.detect-changes.outputs.has_code_changes == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./gradlew sonar \
              -Dsonar.pullrequest.key="$PR_NUMBER" \
              -Dsonar.pullrequest.branch="$PR_BRANCH" \
              -Dsonar.pullrequest.base="$PR_BASE"
          else
            ./gradlew sonar
          fi

      - name: SonarCloud quality gate
        if: env.SONAR_TOKEN != '' && steps.detect-changes.outputs.has_code_changes == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonarCheck

      - name: Publish SNAPSHOT to Maven Central
        if: github.event_name == 'push' && steps.detect-changes.outputs.has_code_changes == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

  e2e-split:
    name: E2E Split-by-client
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: false

      - name: Detect code changes
        id: detect-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
          fi
          if echo "$CHANGED" | grep -qE '\.(kt|kts|gradle|yml|yaml|toml)$'; then
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish plugin to Maven Local
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        run: ./gradlew publishToMavenLocal

      - name: Generate split-by-client subproject
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        working-directory: e2e-split
        run: >
          ./gradlew initApiClientSubproject
          -PopenApiFile=src/main/openapi/sample.json
          -PsplitByClient=true
          -PbasePackage=org.litote.sample
          -PsplitGranularity=BY_TAG_AND_OPERATION
          -PsharedModelGranularity=SHARED_PER_GROUP
          -PsubprojectRootDirectory=client

      - name: Verify generated structure
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        working-directory: e2e-split
        run: |
          EXPECTED_DIRS=(
            "client/shared"
            "client/shared-userusersget-useruserspost"
            "client/shared-orderordersget-orderorderspost"
            "client/user-users-get-client"
            "client/user-users-post-client"
            "client/order-orders-get-client"
            "client/order-orders-post-client"
          )
          for dir in "${EXPECTED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Missing expected directory: $dir"
              exit 1
            fi
            echo "OK: $dir"
          done
          if ! grep -q 'openapi-ktor-generated-includes' settings.gradle.kts; then
            echo "settings.gradle.kts is missing the generated includes marker"
            exit 1
          fi
          if ! grep -q 'include(' settings.gradle.kts; then
            echo "settings.gradle.kts is missing include() statements"
            exit 1
          fi
          echo "settings.gradle.kts includes:"
          grep 'include(' settings.gradle.kts

      - name: Build generated subproject
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        working-directory: e2e-split
        run: ./gradlew build


  e2e:
    name: E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: false

      - name: Detect code changes
        id: detect-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
          fi
          if echo "$CHANGED" | grep -qE '\.(kt|kts|gradle|yml|yaml|toml)$'; then
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish plugin to Maven Local
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        run: ./gradlew publishToMavenLocal

      - name: Build e2e project
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        working-directory: e2e
        run: ./gradlew build

      - name: Verify generated code is up-to-date
        if: steps.detect-changes.outputs.has_code_changes == 'true'
        run: |
          git diff --exit-code -- e2e/ || {
            echo "Generated code in e2e/ is out of date. Run ./gradlew build in e2e/ and commit the result."
            git diff -- e2e/
            exit 1
          }

