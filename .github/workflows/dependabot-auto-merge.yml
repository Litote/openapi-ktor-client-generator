name: Dependabot auto-merge

on:
  # pull_request_target gives access to the GitHub App secrets, which pull_request
  # events from Dependabot do not. No PR code is checked out or executed here.
  pull_request_target:
    branches: [ main ]
    types: [ opened, reopened ]

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-auto-merge.yml@27a178b4699243bc39482a3e41c05b1ca91dc9a6 # v0.8.0
    with:
      ecosystems: gradle
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
