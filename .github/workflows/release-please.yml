name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release manually (e.g. v0.3.0)'
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: Litote/ci/.github/actions/release-please@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        id: release-please
        if: github.event_name == 'push'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # refs/tags/: a manual run cannot publish a branch
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - uses: Litote/ci/.github/actions/setup-gradle@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/set-release-version@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Build & test
        run: ./gradlew check

      - name: Jacoco aggregated report
        run: ./gradlew jacocoAggregatedReport

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

      - uses: Litote/ci/.github/actions/maven-central-publish@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          signing-key-id: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          signing-key-password: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Publish to Gradle Plugin Portal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        # the plugin reads GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET: no secret on the command line
        run: ./gradlew publishPlugins

