name: Update Kotlin yarn lock

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'

jobs:
  # A version bump is a code change: this job runs the code of the new versions, as soon as
  # the pull request opens and before any review. So it has no secret and no write access:
  # the commit job holds the GitHub App token and executes nothing from this one.
  update-yarn-lock:
    name: Regenerate Kotlin yarn lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout the base branch to avoid executing the build scripts of the pull request.
      # Only the version catalog is then taken from it. The Kotlin version it carries drives
      # the regenerated yarn locks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}

      - name: Apply dependabot version changes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          git checkout FETCH_HEAD -- gradle/libs.versions.toml

      - uses: Litote/ci/.github/actions/setup-gradle@27a178b4699243bc39482a3e41c05b1ca91dc9a6 # v0.8.0
        with:
          # Jobs that hold secrets restore this cache. GitHub already gives this event
          # read-only access to it.
          cache-read-only: 'true'

      # Publishing builds the plugin with the bumped Kotlin version (PluginVersion.kt is
      # regenerated from libs.versions.toml), so the generated subproject and its yarn
      # locks are produced for the new Kotlin version.
      # Dependency verification is disabled: this job only pulls libs.versions.toml from
      # the PR (not the regenerated verification-metadata.xml, which is owned by the
      # gradle-verification workflow), so the bumped artifacts are not yet listed. The
      # yarn lock content does not depend on artifact checksums, so skipping verification
      # here does not change the result and decouples this job from that workflow.
      - name: Publish plugin to Maven Local
        run: ./gradlew publishToMavenLocal --dependency-verification off

      - name: Generate split-by-client subproject
        working-directory: e2e-split
        run: >
          ./gradlew initApiClientSubproject
          -PopenApiFile=src/main/openapi/sample.json
          -PsplitByClient=true
          -PbasePackage=org.litote.sample
          -PsplitGranularity=BY_TAG_AND_OPERATION
          -PsharedModelGranularity=SHARED_PER_GROUP
          -PsubprojectRootDirectory=client

      # kotlinUpgradeYarnLock starts from the stored locks (kotlinRestoreYarnLock) and keeps
      # their resolved versions, so transitive security fixes would never be picked up.
      # Removing the locks forces a full resolution.
      - name: Regenerate Kotlin yarn lock
        working-directory: e2e-split
        run: |
          rm -f kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock
          ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock

      - uses: Litote/ci/.github/actions/upload-regenerated-files@27a178b4699243bc39482a3e41c05b1ca91dc9a6 # v0.8.0
        with:
          paths: e2e-split/kotlin-js-store/yarn.lock e2e-split/kotlin-js-store/wasm/yarn.lock

  commit-yarn-lock:
    name: Commit Kotlin yarn lock
    needs: update-yarn-lock
    # Shared with the other dependabot workflow: both push a commit to the PR branch
    # on top of its current HEAD, so running them in parallel makes the second ref
    # update fail with "Update is not a fast forward". `queue: max` keeps every pending
    # job instead of replacing it.
    concurrency:
      group: dependabot-branch-update-${{ github.head_ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}

      # Only the index moves to the PR head: commit-via-api sees the changes relative to it,
      # and this job, which holds the App token, keeps the files of the PR off the disk.
      - name: Compare with the pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth 1 origin "$HEAD_SHA"
          git reset --quiet FETCH_HEAD

      - uses: Litote/ci/.github/actions/apply-regenerated-files@27a178b4699243bc39482a3e41c05b1ca91dc9a6 # v0.8.0
        with:
          paths: e2e-split/kotlin-js-store/yarn.lock e2e-split/kotlin-js-store/wasm/yarn.lock

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: Litote/ci/.github/actions/commit-via-api@27a178b4699243bc39482a3e41c05b1ca91dc9a6 # v0.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.head_ref }}
          paths: e2e-split/kotlin-js-store/yarn.lock e2e-split/kotlin-js-store/wasm/yarn.lock
          message: 'chore: update Kotlin yarn lock'
          expected-head: ${{ github.event.pull_request.head.sha }}
