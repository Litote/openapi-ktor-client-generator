name: Update Kotlin yarn lock

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'

jobs:
  update-yarn-lock:
    name: Regenerate Kotlin yarn lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    # Shared with the other dependabot workflow: both push a commit to the PR branch
    # on top of its current HEAD, so running them in parallel makes the second ref
    # update fail with "Update is not a fast forward". Declared at job level so that
    # runs skipped by the `if` above (triggered by our own bot commits) stay out of
    # the group; `queue: max` keeps every pending job instead of replacing it.
    concurrency:
      group: dependabot-branch-update-${{ github.head_ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Checkout the base branch (trusted code) to avoid executing untrusted build scripts.
      # Only the version catalog is then fetched from the PR branch — it has safe,
      # predictable content from dependabot. The Kotlin version it carries drives the
      # regenerated yarn locks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply dependabot version changes
        id: pr-head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git checkout FETCH_HEAD -- gradle/libs.versions.toml

      - uses: Litote/ci/.github/actions/setup-gradle@731f25b65744afb6ed50783472a6746193353272 # v0.6.0

      # Publishing builds the plugin with the bumped Kotlin version (PluginVersion.kt is
      # regenerated from libs.versions.toml), so the generated subproject and its yarn
      # locks are produced for the new Kotlin version.
      # Dependency verification is disabled: this job only pulls libs.versions.toml from
      # the PR (not the regenerated verification-metadata.xml, which is owned by the
      # gradle-verification workflow), so the bumped artifacts are not yet listed. The
      # yarn lock content does not depend on artifact checksums, so skipping verification
      # here is safe and decouples this job from the verification-metadata workflow.
      - name: Publish plugin to Maven Local
        run: ./gradlew publishToMavenLocal --dependency-verification off

      - name: Generate split-by-client subproject
        working-directory: e2e-split
        run: >
          ./gradlew initApiClientSubproject
          -PopenApiFile=src/main/openapi/sample.json
          -PsplitByClient=true
          -PbasePackage=org.litote.sample
          -PsplitGranularity=BY_TAG_AND_OPERATION
          -PsharedModelGranularity=SHARED_PER_GROUP
          -PsubprojectRootDirectory=client

      # kotlinUpgradeYarnLock starts from the stored locks (kotlinRestoreYarnLock) and keeps
      # their resolved versions, so transitive security fixes would never be picked up.
      # Removing the locks forces a full resolution.
      - name: Regenerate Kotlin yarn lock
        working-directory: e2e-split
        run: |
          rm -f kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock
          ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock

      - uses: Litote/ci/.github/actions/commit-via-api@731f25b65744afb6ed50783472a6746193353272 # v0.6.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.head_ref }}
          paths: e2e-split/kotlin-js-store/yarn.lock e2e-split/kotlin-js-store/wasm/yarn.lock
          message: 'chore: update Kotlin yarn lock'
          expected-head: ${{ steps.pr-head.outputs.sha }}
