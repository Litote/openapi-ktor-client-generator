version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "Litote/*"
    groups:
      # A release of Litote/ci updates several workflows and actions: bump them in a single PR
      litote-ci:
        patterns:
          - "Litote/ci/*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
